services:
  mcp-server:
    build:
      context: ..
      dockerfile: mcp-adk-container-1/Dockerfile
    container_name: phishing-detector-mcp
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - PYTHONUNBUFFERED=1
      - OPENBLAS_NUM_THREADS=1
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',3000)); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - mcp-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: phishing-detector-tunnel
    command: tunnel --no-autoupdate --url http://mcp-server:3000
    depends_on:
      mcp-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mcp-net

networks:
  mcp-net:
    driver: bridge
